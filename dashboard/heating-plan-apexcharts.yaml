# Requires ApexCharts Card from HACS.
# Adapt the entity ID if Home Assistant generated a different slug.
type: custom:apexcharts-card
header:
  show: true
  title: Wärmepumpe – Heizungsplan
  show_states: true
graph_span: 36h
span:
  start: hour
now:
  show: true
  label: Jetzt
yaxis:
  - id: offset
    decimals: 0
    apex_config:
      title:
        text: Offset (K)
  - id: outdoor
    opposite: true
    decimals: 1
    apex_config:
      title:
        text: Außen (°C)
series:
  - entity: sensor.warmepumpen_optimierer_heizplan
    name: Geplanter Offset
    yaxis_id: offset
    type: line
    curve: stepline
    stroke_width: 3
    data_generator: |
      const plan = entity.attributes.plan || [];
      return plan.map(p => [new Date(p.datetime).getTime(), Number(p.offset)]);
  - entity: sensor.warmepumpen_optimierer_heizplan
    name: Außentemperatur
    yaxis_id: outdoor
    type: line
    curve: smooth
    stroke_width: 2
    data_generator: |
      const plan = entity.attributes.plan || [];
      return plan.map(p => [new Date(p.datetime).getTime(), Number(p.outdoor_temperature)]);
